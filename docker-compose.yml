services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-raftlabs_orders}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: ["raftlabs_pg:/var/lib/postgresql/data"]
volumes:
  raftlabs_pg:
